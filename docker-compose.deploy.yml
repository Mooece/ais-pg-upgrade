services:
  aistudio-api:
    image: aistudio-api:${AISTUDIO_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aistudio-api
    restart: unless-stopped
    init: true
    mem_limit: 1200m
    memswap_limit: 1600m
    ports:
      - "127.0.0.1:${AISTUDIO_PORT:-8080}:8080"
    volumes:
      - aistudio-api-data:/app/data
    environment:
      AISTUDIO_PORT: "8080"
      AISTUDIO_DATA_DIR: /app/data
      AISTUDIO_ACCOUNTS_DIR: /app/data/accounts
      AISTUDIO_STATS_FILE: /app/data/stats.json
      AISTUDIO_ROTATOR_STATE_FILE: /app/data/rotator_state.json
      AISTUDIO_CONFIG_FILE: /app/data/config.yaml
      AISTUDIO_WEB_PASSWORD: ${AISTUDIO_WEB_PASSWORD:?Set a strong AISTUDIO_WEB_PASSWORD in deploy/vps.env}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    container_name: aistudio-api-caddy
    restart: unless-stopped
    depends_on:
      aistudio-api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN to the public domain for this service}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  aistudio-api-data:
  caddy-data:
  caddy-config:
